<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Mirror NLP Sandbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #8b5cf6;
            --danger: #ef4444;
            --success: #10b981;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-weight: 600;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 8px;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
            transition: all 0.3s ease;
            position: relative;
        }

        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.7);
        }

        .mic-btn.recording {
            background: var(--danger);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 12px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            outline: none;
            cursor: pointer;
        }

        select option {
            background: var(--bg-color);
            color: white;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1rem;
            min-height: 24px;
            color: var(--text-muted);
            font-weight: 300;
        }

        textarea.transcript-box {
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            color: white;
            width: 100%;
            box-sizing: border-box;
            margin: 20px 0 10px 0;
            padding: 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            min-height: 80px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea.transcript-box:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .primary-btn:hover {
            background: var(--primary-hover);
        }

        .output-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .json-viewer {
            background: #000;
            padding: 20px;
            border-radius: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-x: auto;
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
            text-align: left;
        }
        
        .json-key { color: #60a5fa; }
        .json-string { color: #34d399; }
        .json-boolean { color: #fbbf24; }
        .json-number { color: #f472b6; }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .badge.success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.error { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge.info { background: rgba(59, 130, 246, 0.2); color: var(--primary); }

        .loader {
            display: none;
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255,255,255,0.1);
            border-bottom-color: var(--primary);
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Magic Mirror AI</h1>
        <p class="subtitle">NLP Semantic Extraction Sandbox</p>
    </header>

    <div class="glass-panel">
        <div class="controls">
            <button class="mic-btn" id="micBtn" title="Start Recording">
                🎙️
            </button>
            
            <div class="options">
                <label for="extractorSelect">AI Model Backend</label>
                <select id="extractorSelect" disabled style="cursor: default; opacity: 0.9;">
                    <option value="qwen" selected>Local Qwen2.5:1.5b (Ollama)</option>
                </select>
            </div>
        </div>

        <div class="status" id="statusText">Ready. Click the microphone to speak, or type below.</div>
        <textarea id="transcriptInput" class="transcript-box" rows="3" placeholder="Speak into the mic or type here..."></textarea>
        <div style="text-align: center;">
            <button id="sendBtn" class="primary-btn">Send to AI Model</button>
        </div>
        
        <div class="loader" id="loader"></div>

        <div class="output-grid" id="outputArea" style="display: none;">
            <div>
                <span class="badge" id="validationBadge">Validation Pending</span>
                <span class="badge info" id="latencyBadge">0.0s</span>
                <div class="json-viewer" id="jsonOutput"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const transcriptInput = document.getElementById('transcriptInput');
    const sendBtn = document.getElementById('sendBtn');
    const extractorSelect = document.getElementById('extractorSelect');
    const loader = document.getElementById('loader');
    const outputArea = document.getElementById('outputArea');
    const jsonOutput = document.getElementById('jsonOutput');
    const validationBadge = document.getElementById('validationBadge');
    const latencyBadge = document.getElementById('latencyBadge');

    let recognition = null;
    let isRecording = false;

    // Check for browser support
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
            isRecording = true;
            micBtn.classList.add('recording');
            statusText.textContent = "Listening... (speak clearly)";
            outputArea.style.display = 'none';
        };

        recognition.onresult = function(event) {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript) {
                // Append final transcript
                let currentVal = transcriptInput.value.trim();
                transcriptInput.value = currentVal ? currentVal + " " + finalTranscript : finalTranscript;
            }
        };

        recognition.onerror = function(event) {
            statusText.textContent = `Error: ${event.error}`;
            micBtn.classList.remove('recording');
            isRecording = false;
        };

        recognition.onend = function() {
            micBtn.classList.remove('recording');
            isRecording = false;
            statusText.textContent = "Ready. Click the microphone to speak, or type below.";
        };

    } else {
        statusText.textContent = "Speech Recognition API not supported in this browser. Please use Chrome/Edge.";
        micBtn.style.opacity = '0.5';
        micBtn.disabled = true;
    }

    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
    });

    sendBtn.addEventListener('click', () => {
        const text = transcriptInput.value.trim();
        if (text) {
            processText(text);
        } else {
            statusText.textContent = "Please enter some text or use the microphone.";
        }
    });

    // Syntax highlighting for JSON
    function syntaxHighlight(json) {
        if (typeof json != 'string') {
            json = JSON.stringify(json, undefined, 2);
        }
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            var cls = 'json-number';
            if (/^"/.test(match)) {
                if (/:$/.test(match)) {
                    cls = 'json-key';
                } else {
                    cls = 'json-string';
                }
            } else if (/true|false/.test(match)) {
                cls = 'json-boolean';
            } else if (/null/.test(match)) {
                cls = 'json-boolean';
            }
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    async function processText(text) {
        statusText.textContent = "Processing with AI Model...";
        loader.style.display = "block";
        outputArea.style.display = "none";
        
        const extractor = extractorSelect.value;
        
        try {
            const response = await fetch('/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, extractor: extractor })
            });
            
            const data = await response.json();
            
            loader.style.display = "none";
            outputArea.style.display = "block";
            
            if (data.error) {
                statusText.textContent = "Processing failed.";
                jsonOutput.innerHTML = `<span style="color:var(--danger)">Error: ${data.error}</span>`;
                validationBadge.className = 'badge error';
                validationBadge.textContent = 'Error';
                latencyBadge.style.display = 'none';
            } else {
                statusText.textContent = "Extraction complete!";
                jsonOutput.innerHTML = syntaxHighlight(data.output);
                
                latencyBadge.style.display = 'inline-block';
                latencyBadge.textContent = `Latency: ${data.latency}`;
                
                if (data.valid) {
                    validationBadge.className = 'badge success';
                    validationBadge.textContent = 'Schema Valid';
                } else {
                    validationBadge.className = 'badge error';
                    validationBadge.textContent = 'Schema Invalid';
                    jsonOutput.innerHTML += `<br><br><span style="color:var(--danger)">Validation Error: ${data.validation_error}</span>`;
                }
            }
        } catch (error) {
            loader.style.display = "none";
            statusText.textContent = "Network error occurred.";
            console.error(error);
        }
    }
</script>

</body>
</html>
